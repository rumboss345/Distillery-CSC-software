services:
  postgres:
    image: postgres:16-alpine
    container_name: csc-distillery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: csc
      POSTGRES_PASSWORD: csc_dev_password
      POSTGRES_DB: csc_distillery
    ports:
      - '5432:5432'
    volumes:
      - csc_pg_data:/var/lib/postgresql/data

volumes:
  csc_pg_data:
